[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pillow-wash"
version = "0.1.0"
description = "Sanitize untrusted images by whitelist-rebuild: clean pixels, vetted metadata, nothing inherited from the input."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "pillow-wash contributors" }]
keywords = ["security", "image", "sanitize", "upload", "metadata", "steg-free"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pillow-wash = "pillow_wash.cli:main"

[project.urls]
Documentation = "https://github.com/pillow-wash/pillow-wash#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/pillow_wash"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "corpus: real-world samples provided out-of-band via tests/corpus/ or PILLOW_WASH_CORPUS (skips when absent)",
]
